server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css image/svg+xml;

    # HTML y CSS no llevan hash en el nombre: se revalidan en cada visita (ETag).
    location / {
        add_header Cache-Control "no-cache";
        # /privacidad -> privacidad.html, etc.
        try_files $uri $uri.html $uri/ =404;
    }

    # La fuente nunca cambia; las imagenes y los videos se cachean una semana.
    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(webp|png|mp4)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~ (Dockerfile|nginx\.conf)$ {
        return 404;
    }
}
